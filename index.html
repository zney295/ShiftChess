<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101525">
    <meta name="description" content="Play ShiftChess, a 3D chess variant with shifting pieces. Play locally, challenge the computer, or join an online match.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="ShiftChess">
    <meta property="og:description" content="Read the board and anticipate the shift. Play 3D chess locally, against the computer, or online.">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="./favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>ShiftChess</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #121016;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity .5s ease, visibility .5s ease;
      }
      #initial-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .initial-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.4rem;
        padding: 1rem;
      }
      .initial-loader-title {
        font-family: Cinzel, "Playfair Display", Georgia, serif;
        font-size: clamp(2.4rem, 6vw, 3.8rem);
        letter-spacing: .04em;
        white-space: nowrap;
        margin: 0;
        display: flex;
        align-items: baseline;
      }
      .initial-loader-shift {
        color: #d99b3e;
        background: linear-gradient(135deg, #f3c776, #d99b3e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .initial-loader-chess {
        color: #f8f0e3;
      }
      .initial-loader-bar-wrap {
        width: clamp(220px, 45vw, 320px);
        height: 6px;
        background: rgba(248, 240, 227, 0.08);
        border: 1px solid rgba(217, 155, 62, 0.35);
        border-radius: 999px;
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .initial-loader-bar {
        height: 100%;
        width: 15%;
        background: linear-gradient(90deg, #d99b3e, #f3c776);
        border-radius: 999px;
        box-shadow: 0 0 12px rgba(243, 199, 118, 0.6);
        transition: width .35s ease;
      }
      .initial-loader-text {
        font-family: Inter, system-ui, sans-serif;
        font-size: .88rem;
        color: #b8a99a;
        margin: 0;
        letter-spacing: .03em;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader" role="status" aria-live="polite">
      <div class="initial-loader-content">
        <h1 class="initial-loader-title">
          <span class="initial-loader-shift">Shift</span><span class="initial-loader-chess">Chess</span>
        </h1>
        <div class="initial-loader-bar-wrap">
          <div id="initial-progress-bar" class="initial-loader-bar"></div>
        </div>
        <p id="initial-loader-status" class="initial-loader-text">Đang chuẩn bị bàn cờ…</p>
      </div>
    </div>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
