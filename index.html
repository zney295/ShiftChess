<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f1ea">
    <meta name="description" content="Play ShiftChess, a 3D tactical chess variant with shifting squares and simultaneous clashes.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="ShiftChess">
    <meta property="og:description" content="Read the board. Anticipate the shift. Play 3D chess locally, against the computer, or online.">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="./favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>ShiftChess</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background:
          radial-gradient(circle at 25% 25%, rgba(235, 77, 53, 0.12), transparent 50%),
          radial-gradient(circle at 75% 75%, rgba(16, 155, 126, 0.12), transparent 50%),
          linear-gradient(160deg, #faf8f4 0%, #efebe2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity .42s ease, visibility .42s ease;
      }
      #initial-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .initial-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 24px;
      }
      .loader-mark {
        width: 60px;
        height: 60px;
        filter: drop-shadow(0 10px 22px rgba(21, 30, 44, 0.12));
      }
      .loader-tile-a {
        animation: loader-swap-a 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .loader-tile-b {
        animation: loader-swap-b 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .loader-ring {
        transform-origin: center;
        animation: loader-pulse 1.6s ease-out infinite;
      }
      @keyframes loader-swap-a {
        0%, 16% { transform: translate(0, 0) scale(1); }
        34% { transform: translate(11px, 6px) scale(1.1); }
        50%, 66% { transform: translate(22px, 22px) scale(1); }
        84% { transform: translate(11px, 16px) scale(0.92); }
        100% { transform: translate(0, 0) scale(1); }
      }
      @keyframes loader-swap-b {
        0%, 16% { transform: translate(0, 0) scale(1); }
        34% { transform: translate(-11px, -16px) scale(0.92); }
        50%, 66% { transform: translate(-22px, -22px) scale(1); }
        84% { transform: translate(-11px, -6px) scale(1.1); }
        100% { transform: translate(0, 0) scale(1); }
      }
      @keyframes loader-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.96); }
        50% { opacity: 0.7; transform: scale(1.03); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-tile-a, .loader-tile-b, .loader-ring { animation: none; }
      }
      .initial-loader-title {
        font-family: Fraunces, "Playfair Display", Georgia, serif;
        font-size: clamp(2.1rem, 5vw, 3.1rem);
        font-weight: 600;
        letter-spacing: -.03em;
        white-space: nowrap;
        margin: 0;
        display: flex;
        align-items: baseline;
      }
      .initial-loader-shift {
        color: #151e2c;
      }
      .initial-loader-chess {
        color: #eb4d35;
      }
      .initial-loader-bar-wrap {
        width: clamp(200px, 40vw, 280px);
        height: 5px;
        background: rgba(21, 30, 44, 0.10);
        border-radius: 999px;
        overflow: hidden;
      }
      .initial-loader-bar {
        height: 100%;
        width: 18%;
        background: linear-gradient(90deg, #eb4d35, #f5a623);
        border-radius: 999px;
        transition: width .3s ease;
      }
      .initial-loader-text {
        font-family: Inter, system-ui, sans-serif;
        font-size: .84rem;
        font-weight: 500;
        color: #546277;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader" role="status" aria-live="polite">
      <div class="initial-loader-content">
        <svg class="loader-mark" viewBox="0 0 52 52" fill="none" aria-hidden="true">
          <rect class="loader-ring" x="2" y="2" width="48" height="48" rx="12" fill="#ffffff" stroke="rgba(21,30,44,0.14)" stroke-width="1.5"/>
          <rect x="6" y="28" width="18" height="18" rx="5" fill="#e6e1d7"/>
          <rect x="28" y="6" width="18" height="18" rx="5" fill="#e6e1d7"/>
          <rect class="loader-tile-a" x="6" y="6" width="18" height="18" rx="5" fill="#eb4d35"/>
          <rect class="loader-tile-b" x="28" y="28" width="18" height="18" rx="5" fill="#109b7e"/>
        </svg>
        <h1 class="initial-loader-title">
          <span class="initial-loader-shift">Shift</span><span class="initial-loader-chess">Chess</span>
        </h1>
        <div class="initial-loader-bar-wrap">
          <div id="initial-progress-bar" class="initial-loader-bar"></div>
        </div>
        <p id="initial-loader-status" class="initial-loader-text">Preparing the board…</p>
      </div>
    </div>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
